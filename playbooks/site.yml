---
- hosts: all
  become: true

  vars:
    # Set defaults here. Override via CLI (--extra-vars), group_vars/,
    # host_vars/, or environment. Ansible variable precedence ensures
    # overrides always take effect over these playbook-level defaults.
    cloud_provider: aws
    orchestrator: microk8s

  pre_tasks:
    - name: "Ensure exactly one cloud_provider is set (gcp or aws)"
      assert:
        that:
          - cloud_provider in ['gcp','aws']
        fail_msg: "You must set cloud_provider to 'gcp' or 'aws', not both."

    - name: "Ensure exactly one orchestrator is set (microk8s or minikube)"
      assert:
        that:
          - orchestrator in ['microk8s','minikube']
        fail_msg: "You must set orchestrator to 'microk8s' or 'minikube', not both."

  roles:
    - essentials
    - zsh
    - hardening
    - docker
    - podman
    - jenkins
    - nginx

    - role: google-sdk
      when: cloud_provider == 'gcp'

    - role: aws_cli
      when: cloud_provider == 'aws'

    - role: microk8s
      when: orchestrator == 'microk8s'

    - role: minikube
      when: orchestrator == 'minikube'

    - packer
    - terraform
