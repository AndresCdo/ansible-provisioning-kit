[defaults]
inventory = inventory/hosts.yml
roles_path = roles
# SECURITY: Enable SSH host key verification to prevent MITM attacks.
# For local connections (ansible_connection: local) this setting has no effect.
# If connecting to remote hosts, pre-populate known_hosts via:
#   ssh-keyscan -H <hostname> >> ~/.ssh/known_hosts
# or use the hardening role which includes a known_hosts task.
host_key_checking = True

# Ansible Vault — uncomment and set path when using encrypted secrets:
# vault_password_file = ~/.ansible_vault_pass

[privilege_escalation]
become = True
become_method = sudo
become_user = root
become_ask_pass = False
