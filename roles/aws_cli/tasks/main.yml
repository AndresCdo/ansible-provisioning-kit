---
- name: Check if AWS CLI is installed
  command: aws --version
  register: aws_cli_version
  changed_when: false
  failed_when: false

- name: Show AWS CLI version if installed
  debug:
    var: aws_cli_version.stdout
  when: aws_cli_version.rc == 0

- block:
    - name: Download AWS CLI package
      get_url:
        url: "{{ aws_cli_url }}"
        dest: "{{ aws_cli_zip_path }}"
        mode: 0755
      register: download_result

    - name: Unzip AWS CLI package
      unarchive:
        src: "{{ aws_cli_zip_path }}"
        dest: "{{ aws_cli_install_dir }}"
        remote_src: yes

    - name: Make AWS CLI install script executable
      file:
        path: "{{ aws_cli_install_script }}"
        mode: u+x
        
    - name: Execute AWS CLI install script
      command: "{{ aws_cli_install_script }}"
      register: install_result

    - name: Clean up downloaded archive
      file:
        path: "{{ aws_cli_zip_path }}"
        state: absent
      changed_when: false
  
  when: aws_cli_version.rc != 0
  rescue:
    - name: Installation failed
      fail:
        msg: "AWS CLI installation failed. Please check the logs."
