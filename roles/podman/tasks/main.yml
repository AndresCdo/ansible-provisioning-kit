---
# tasks file for podman
# Removed hosts, become, gather_facts, vars - handled by playbook

- name: Fail if not running on Ubuntu
  ansible.builtin.fail:
    msg: "This playbook is intended for Ubuntu systems only."
  when: ansible_distribution != "Ubuntu"

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: yes
  changed_when: false

- name: Install Podman package from Ubuntu repos
  ansible.builtin.apt:
    name: "{{ podman_package | default('podman') }}" # Add default filter
    state: present
  retries: 3
  delay: 10
  register: apt_result
  until: apt_result is success

- name: Verify Podman installation
  ansible.builtin.command: podman --version
  register: podman_version
  changed_when: false
  notify: Display Podman version

- name: Enable & start Podman rootless socket
  ansible.builtin.systemd:
    name: podman.socket
    enabled: yes
    state: started
    user: yes
  become: true
  become_user: "{{ podman_user | default(ansible_user_id) }}"

- name: Verify Podman rootless socket is running
  ansible.builtin.command: systemctl --user status podman.socket
  become: true
  become_user: "{{ podman_user | default(ansible_user_id) }}"
  register: socket_status
  changed_when: false
  failed_when: socket_status.rc != 0
