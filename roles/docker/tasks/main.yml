---
# tasks file for docker role
- name: Ensure prerequisites are installed
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
    state: present

- name: Create keyrings directory
  ansible.builtin.file:
    path: /usr/share/keyrings
    state: directory
    mode: '0755'

- name: Download and install Docker GPG key
  # NOTE: apt_key module is deprecated on Ubuntu 24.04+ (apt-key binary removed).
  # Using direct download + gpg --dearmor per Docker official docs:
  # https://docs.docker.com/engine/install/ubuntu/#install-using-the-repository
  ansible.builtin.shell:
    cmd: |
      curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /usr/share/keyrings/docker-archive-keyring.gpg
    creates: /usr/share/keyrings/docker-archive-keyring.gpg

- name: Add Docker repository
  ansible.builtin.apt_repository:
    repo: "deb [arch={{ ansible_architecture | replace('x86_64','amd64') }} signed-by=/usr/share/keyrings/docker-archive-keyring.gpg] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
    state: present
    filename: docker

- name: Install Docker packages
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin # Added docker-compose plugin
    state: present
    update_cache: yes

- name: Ensure Docker service is started and enabled
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: yes
    state: started
  loop:
    - docker.service
    - containerd.service

- name: Add users to Docker group
  ansible.builtin.user:
    name: "{{ item }}"
    groups: docker
    append: yes
  loop: "{{ docker_users | default(['ubuntu']) }}" # Make users configurable via variable

- name: Reset connection to apply group changes
  ansible.builtin.meta: reset_connection

- name: Test Docker installation
  ansible.builtin.command: docker run hello-world
  register: docker_hello_world
  changed_when: false
  failed_when: "'Hello from Docker!' not in docker_hello_world.stdout"
